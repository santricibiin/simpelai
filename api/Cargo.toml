[package]
name = "neuroforge-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.9"
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-stream = "0.1.17"
futures-util = "0.3.31"
sqlx = { version = "0.8.2", default-features = false, features = ["runtime-tokio-rustls", "mysql", "macros", "chrono", "json"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
tower-http = { version = "0.6.2", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
dotenvy = "0.15.7"
anyhow = "1.0.94"
argon2 = "0.5.3"
jsonwebtoken = "9.3.0"
chrono = { version = "0.4.39", features = ["serde"] }
rand = "0.8.5"
reqwest = { version = "0.12.9", default-features = false, features = ["json", "stream", "rustls-tls"] }
aes-gcm = "0.10.3"
base64 = "0.22.1"
sha2 = "0.10.8"
url = "2.5.4"

[[bin]]
name = "neuroforge-api"
path = "src/main.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[[bin]]
name = "setpass"
path = "src/bin/setpass.rs"
